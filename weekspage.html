  <script>
    // Received Assistance from Claude AI: 
    const fonts = [
      "'Share Tech Mono', monospace",
      "'VT323', monospace",
      "'Courier Prime', monospace",
      "'Special Elite', cursive",
      "'Cutive Mono', monospace",
      "serif",
      "sans-serif",
      "'Times New Roman', serif"
    ];

    const glitch = document.getElementById('glitch-text');
    let current = 0;

    setInterval(function() {
      current = (current + 1) % fonts.length;
      glitch.style.fontFamily = fonts[current];
    }, 150);

    //custom cursor 
    const cursorImg = document.getElementById('cursor-img');
    document.addEventListener('mousemove', function(e) {
    cursorImg.style.left = (e.clientX + 12) + 'px';
    cursorImg.style.top  = (e.clientY + 12) + 'px';
    });


  </script>
